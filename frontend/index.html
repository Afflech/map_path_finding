<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pathfinding - Đống Đa Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="map"></div>

    <!-- Floating Control Card – top-left -->
    <div id="control-card">
        <div class="card-header">
            <div class="logo-row">
                <span class="logo-icon">🗺️</span>
                <span class="logo-text"> Công cụ tìm đường thông minh</span>
            </div>
            <button class="icon-btn" onclick="resetMap()" title="Làm mới bản đồ">↺</button>
        </div>

        <!-- Origin / Destination fields -->
        <div class="coord-fields">
            <div class="coord-row">
                <span class="coord-dot dot-green"></span>
                <div class="coord-input-wrap">
                    <span class="coord-label">Điểm đi</span>
                    <span class="coord-value" id="start-coords">Chưa chọn</span>
                </div>
            </div>
            <div class="coord-divider"></div>
            <div class="coord-row">
                <span class="coord-dot dot-red"></span>
                <div class="coord-input-wrap">
                    <span class="coord-label">Điểm đến</span>
                    <span class="coord-value" id="end-coords">Chưa chọn</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-section">
            <div class="ctrl-row">
                <span class="ctrl-icon">🚗</span>
                <select id="vehicleType" onchange="triggerRouteRecalc()">
                    <option value="walk">Đi bộ (5 km/h)</option>
                    <option value="bike" selected>Xe máy (30 km/h)</option>
                    <option value="car">Ô tô (50 km/h)</option>
                    <option value="mixed">Đa phương tiện</option>
                </select>
            </div>

            <div class="ctrl-row">
                <span class="ctrl-icon">📍</span>
                <select id="clickMode">
                    <option value="route" selected>Chọn Điểm Đi/Đến</option>
                    <option value="jammed">Đánh dấu Tắc đường</option>
                    <option value="flooded">Đánh dấu Ngập lụt</option>
                </select>
            </div>

            <div class="ctrl-row">
                <span class="ctrl-icon">🛣️</span>
                <select id="routeSelector" onchange="onRouteSelectionChange()">
                    <option value="0" selected>Tuyến 1</option>
                    <option value="1">Tuyến 2</option>
                    <option value="2">Tuyến 3</option>
                </select>
            </div>

            <div class="ctrl-row ctrl-row--between">
                <div class="ctrl-left">
                    <span class="ctrl-icon">▶</span>
                    <span class="ctrl-text">Animation</span>
                </div>
                <label class="md-switch">
                    <input id="animation-toggle-btn" type="checkbox" checked onchange="toggleAnimation()">
                    <span class="md-track"><span class="md-thumb"></span></span>
                </label>
            </div>

            <div class="ctrl-row">
                <span class="ctrl-icon">⚡</span>
                <select id="animationSpeed" onchange="updateAnimationSpeed()">
                    <option value="fast">Nhanh</option>
                    <option value="normal" selected>Vừa</option>
                    <option value="slow">Chậm</option>
                </select>
            </div>
        </div>

        <!-- Nav steps accordion -->
        <details class="nav-accordion">
            <summary>Chi tiết lộ trình</summary>
            <div id="navigation-steps" class="navigation-steps">
                <p class="nav-placeholder">Chưa có chỉ dẫn điều hướng.</p>
            </div>
        </details>
    </div>

    <!-- Floating Result Card – bottom-left -->
    <div id="result-card">
        <div class="result-row">
            <span class="result-icon">📏</span>
            <div>
                <div class="result-label">Quãng đường</div>
                <div class="result-value" id="distance-info">0 km</div>
            </div>
        </div>
        <div class="result-divider"></div>
        <div class="result-row">
            <span class="result-icon">⏱</span>
            <div>
                <div class="result-label">Thời gian</div>
                <div class="result-value" id="time-info">0 phút</div>
            </div>
        </div>
        <div class="result-status">
            <span id="status-text" class="idle">Đang chờ...</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map_logic.js"></script>
</body>
</html>
